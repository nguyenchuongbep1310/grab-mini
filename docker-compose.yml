name: grab-mini

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: grab-mini-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # The image defaults to /tmp/kraft-combined-logs, which is not the
      # mounted volume, so topics would vanish on every `docker compose down`.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: grabminikafkacluster01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: creates the topics the services consume, so a consumer never
  # subscribes to a topic that doesn't exist yet. Dead-letter topics are
  # created on demand by kafkaconsumer.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: grab-mini-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in order.created order.matched order.no_driver_found order.cancelled driver.location.updated trip.status.changed trip.rated payment.recorded; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic $$topic --partitions 3 --replication-factor 1
        done

  # Every event is Avro; producers register their schema here and consumers
  # fetch the writer's schema by id (see services/pkg/eventcodec).
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: grab-mini-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      # The default of 3 can't be satisfied by a single-broker cluster.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: registers every schema up front. ksqlDB infers its columns
  # from the registry, so the subjects must exist before the first event is
  # produced. Services register the same text later, which is a no-op.
  schema-init:
    image: curlimages/curl:8.10.1
    container_name: grab-mini-schema-init
    depends_on:
      schema-registry:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./services/pkg/events/schemas:/schemas:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for file in /schemas/*.avsc; do
          topic=$$(basename "$$file" .avsc)
          schema=$$(tr -d '\n' < "$$file" | sed 's/"/\\"/g')
          curl -fsS -X POST "http://schema-registry:8081/subjects/$$topic-value/versions" \
            -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
            -d "{\"schemaType\":\"AVRO\",\"schema\":\"$$schema\"}"
          echo " <- $$topic-value"
        done

  # Stream processing without writing a consumer: ksqlDB reads the Avro
  # topics and maintains the tables defined in ksql/statements.sql.
  ksqldb-server:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: grab-mini-ksqldb
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_BOOTSTRAP_SERVERS: kafka:19092
      KSQL_KSQL_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KSQL_KSQL_SERVICE_ID: grab-mini_
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
      # Single-broker cluster: everything ksqlDB creates needs replication 1.
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_SINK_REPLICAS: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_QUERY_PULL_TABLE_SCAN_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  # One-shot: runs ksql/statements.sql (every statement is IF NOT EXISTS, so
  # running it again after a restart is safe). The ksql CLI exits 0 even when
  # a statement fails, so its output is checked and a failure made visible.
  ksql-init:
    image: confluentinc/ksqldb-cli:0.29.0
    container_name: grab-mini-ksql-init
    depends_on:
      ksqldb-server:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./ksql/statements.sql:/statements.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ksql http://ksqldb-server:8088 --file /statements.sql > /tmp/out 2>&1
        cat /tmp/out
        if grep -qE "Could not|Failed|Error:|error:" /tmp/out; then echo "ksql-init: a statement failed" >&2; exit 1; fi

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: grab-mini-kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: grab-mini
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb-server:8088

  postgres:
    image: postgres:16-alpine
    container_name: grab-mini-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: grabmini
      POSTGRES_PASSWORD: grabmini
      POSTGRES_DB: grabmini
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grabmini"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grab-mini-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Scrapes /metrics from every Go service running on the host and evaluates
  # deploy/monitoring/alerts.rules.yaml.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: grab-mini-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.rules.yaml:/etc/prometheus/alerts.rules.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Centralized log store for all Go services and frontend apps.
  loki:
    image: grafana/loki:3.0.0
    container_name: grab-mini-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tails .dev/logs/*.log, parses structured slog JSON fields (level, service,
  # trace_id, span_id) and ships them to Loki.
  promtail:
    image: grafana/promtail:3.0.0
    container_name: grab-mini-promtail
    depends_on:
      loki:
        condition: service_healthy
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - ./.dev/logs:/var/log/grab-mini:ro

  # Unified UI for Prometheus metrics and Loki logs, pre-provisioned with
  # datasources and the grab-mini observability dashboard.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grab-mini-grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grab-mini-overview.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kafka-data:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:

