# Replicates the business topics to a standby region's Kafka (Strimzi MirrorMaker 2).
# NOT part of deploy/k8s/base: apply it in the STANDBY region's cluster, after
# editing the two bootstrap addresses and the TLS/credentials secrets. See
# docs/disaster-recovery.md for what it does and does not give you.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: grab-mini-mirror
  namespace: grab-mini
spec:
  version: 3.8.0
  replicas: 2
  connectCluster: standby
  clusters:
    - alias: primary
      bootstrapServers: grab-mini-primary-kafka-bootstrap.example.com:9094   # edit
      tls:
        trustedCertificates:
          - secretName: primary-cluster-ca-cert
            certificate: ca.crt
      authentication:
        type: tls
        certificateAndKey:
          secretName: grab-mini-mirror-user
          certificate: user.crt
          key: user.key
    - alias: standby
      bootstrapServers: grab-mini-kafka-bootstrap:9093
      config:
        config.storage.replication.factor: 3
        offset.storage.replication.factor: 3
        status.storage.replication.factor: 3
      tls:
        trustedCertificates:
          - secretName: grab-mini-cluster-ca-cert
            certificate: ca.crt
      authentication:
        type: tls
        certificateAndKey:
          secretName: grab-mini-mirror-user
          certificate: user.crt
          key: user.key
  mirrors:
    - sourceCluster: primary
      targetCluster: standby
      sourceConnector:
        tasksMax: 6
        config:
          replication.factor: 3
          # Keep topic names unchanged so consumers need no config change on failover.
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
          sync.topic.acls.enabled: "false"
          refresh.topics.interval.seconds: 60
      checkpointConnector:
        tasksMax: 1
        config:
          checkpoints.topic.replication.factor: 3
          # Translates committed consumer-group offsets to the standby's offsets,
          # so consumers resume near where they were instead of from the start.
          sync.group.offsets.enabled: "true"
          sync.group.offsets.interval.seconds: 30
          replication.policy.class: org.apache.kafka.connect.mirror.IdentityReplicationPolicy
      # The location stream is telemetry: a failover loses nothing worth copying.
      topicsPattern: "order\\..*|trip\\..*"
      groupsPattern: ".*-group"
