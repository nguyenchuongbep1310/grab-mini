# Generated by deploy/k8s/generate.py: edit that, not this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-scripts
  labels:
    app.kubernetes.io/name: redis-scripts
    app.kubernetes.io/part-of: grab-mini
    app.kubernetes.io/component: redis
data:
  redis-start.sh: |
    #!/bin/sh
    # Starts the redis container of one StatefulSet pod (deploy/k8s generate.py puts
    # the three scripts in this directory in a ConfigMap; scripts/test-redis-ha.sh
    # runs them on real Redis and Sentinel).
    #
    # Who is master is decided by the Sentinels, not by this script: it only has
    # to join the cluster the way it is NOW, not the way it was at first boot.
    #   1. ask the other Sentinels for the master; if one answers, follow that
    #      (if it names this very pod, this pod is the master that restarted);
    #   2. else ask the other Redis nodes for their role and follow the master;
    #   3. else (cold start, nobody answers) redis-0 is the master and the others
    #      replicate redis-0.
    # Environment: REDIS_PASSWORD (from the Secret), REDIS_DOMAIN (headless Service
    # domain the pods are reachable under), REDIS_MASTER_NAME, REDIS_REPLICAS,
    # REDIS_MAXMEMORY.
    set -eu

    : "${REDIS_PASSWORD:?}" "${REDIS_DOMAIN:?}"
    export REDISCLI_AUTH=$REDIS_PASSWORD
    name=${REDIS_MASTER_NAME:-mymaster}
    count=${REDIS_REPLICAS:-3}
    me=$HOSTNAME
    base=${me%-*}
    fqdn=$me.$REDIS_DOMAIN
    conf=${REDIS_CONF:-/conf/redis.conf}

    master=
    i=0
    while [ "$i" -lt "$count" ] && [ -z "$master" ]; do
      peer=$base-$i
      if [ "$peer" != "$me" ]; then
        master=$(timeout 3 redis-cli -h "$peer.$REDIS_DOMAIN" -p 26379 sentinel get-master-addr-by-name "$name" 2> /dev/null | head -n 1 || true)
      fi
      i=$((i + 1))
    done
    if [ -z "$master" ]; then
      i=0
      while [ "$i" -lt "$count" ] && [ -z "$master" ]; do
        peer=$base-$i
        if [ "$peer" != "$me" ]; then
          out=$(timeout 3 redis-cli -h "$peer.$REDIS_DOMAIN" role 2> /dev/null || true)
          if [ "$(echo "$out" | head -n 1)" = master ]; then master=$peer.$REDIS_DOMAIN; fi
        fi
        i=$((i + 1))
      done
    fi
    if [ -z "$master" ] && [ "$me" != "$base-0" ]; then master=$base-0.$REDIS_DOMAIN; fi
    [ "$master" = "$fqdn" ] && master=

    {
      echo "port 6379"
      echo "requirepass $REDIS_PASSWORD"
      echo "masterauth $REDIS_PASSWORD"
      echo "dir /data"
      # AOF every second: a crash loses at most about a second of writes. No RDB
      # snapshots on top: they fork the process for nothing the AOF doesn't already give.
      echo "appendonly yes"
      echo "appendfsync everysec"
      echo 'save ""'
      # noeviction: a full Redis refuses writes loudly. Evicting would silently drop
      # a lease or a match claim, which is worse than an error the service retries.
      echo "maxmemory ${REDIS_MAXMEMORY:-400mb}"
      echo "maxmemory-policy noeviction"
      # Pods change IP when they restart; Sentinel and the other replicas find this one by name.
      echo "replica-announce-ip $fqdn"
      # A replica must not serve reads from a stale copy while it resyncs.
      echo "replica-serve-stale-data no"
      # If the master has no replica at all it keeps accepting writes (availability over
      # the last second of data), which is also what Sentinel failover assumes.
      if [ -n "$master" ]; then echo "replicaof $master 6379"; fi
    } > "$conf"

    echo "starting as $([ -n "$master" ] && echo "replica of $master" || echo master)"
    exec redis-server "$conf"
  sentinel-start.sh: |
    #!/bin/sh
    # Starts the sentinel container of one StatefulSet pod. It watches the Redis in
    # its own pod first and learns the rest from the other Sentinels, so it never
    # needs to be told who the master is: it asks the Redis next to it, which
    # redis-start.sh pointed at the current master.
    # Environment: REDIS_PASSWORD, REDIS_DOMAIN, REDIS_MASTER_NAME, SENTINEL_QUORUM
    # (default 2 of 3), SENTINEL_DOWN_AFTER_MS (default 5000).
    set -eu

    : "${REDIS_PASSWORD:?}" "${REDIS_DOMAIN:?}"
    export REDISCLI_AUTH=$REDIS_PASSWORD
    name=${REDIS_MASTER_NAME:-mymaster}
    fqdn=$HOSTNAME.$REDIS_DOMAIN
    conf=${SENTINEL_CONF:-/sentinel/sentinel.conf}

    # Wait for the Redis in this pod: its role says who the master is.
    master=
    tries=0
    while [ -z "$master" ]; do
      out=$(timeout 3 redis-cli -h 127.0.0.1 role 2> /dev/null || true)
      case "$(echo "$out" | head -n 1)" in
        master) master=$fqdn ;;
        slave) master=$(echo "$out" | sed -n 2p) ;;
      esac
      [ -n "$master" ] && break
      tries=$((tries + 1))
      [ "$tries" -gt 120 ] && { echo "the Redis in this pod never answered" >&2; exit 1; }
      sleep 1
    done

    # A stable id: a restarted Sentinel (new IP) must be recognised as the same one,
    # or the others keep a ghost of the old run and count it towards the quorum.
    myid=$(printf '%s' "$HOSTNAME" | sha1sum | cut -c1-40)

    cat > "$conf" << EOF
    port 26379
    dir /sentinel
    requirepass $REDIS_PASSWORD
    sentinel myid $myid
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $fqdn
    sentinel monitor $name $master 6379 ${SENTINEL_QUORUM:-2}
    sentinel auth-pass $name $REDIS_PASSWORD
    sentinel down-after-milliseconds $name ${SENTINEL_DOWN_AFTER_MS:-5000}
    sentinel failover-timeout $name 30000
    sentinel parallel-syncs $name 1
    EOF

    echo "sentinel for $name, master at $master"
    exec redis-sentinel "$conf"
  redis-prestop.sh: |
    #!/bin/sh
    # preStop of the redis container: if this pod is the master, hand the role to a
    # replica first, so a node drain or rolling update costs a planned failover
    # (seconds) rather than waiting for Sentinel to notice a dead master (down-after
    # + election). Never fails: a pod that cannot hand over is still allowed to stop.
    export REDISCLI_AUTH=${REDIS_PASSWORD:-}
    name=${REDIS_MASTER_NAME:-mymaster}
    count=${REDIS_REPLICAS:-3}
    me=$HOSTNAME
    base=${me%-*}

    [ "$(timeout 3 redis-cli -h 127.0.0.1 role 2> /dev/null | head -n 1)" = master ] || exit 0

    i=0
    while [ "$i" -lt "$count" ]; do
      peer=$base-$i
      if [ "$peer" != "$me" ]; then
        # A Sentinel on another pod (ours is stopping at the same time as this container).
        if timeout 5 redis-cli -h "$peer.$REDIS_DOMAIN" -p 26379 sentinel failover "$name" 2> /dev/null | grep -q OK; then
          # Wait until this node is no longer the master, so no write is lost to a
          # half-finished handover.
          n=0
          while [ "$n" -lt 20 ]; do
            [ "$(timeout 3 redis-cli -h 127.0.0.1 role 2> /dev/null | head -n 1)" = master ] || exit 0
            n=$((n + 1))
            sleep 1
          done
          exit 0
        fi
      fi
      i=$((i + 1))
    done
    exit 0
