# Alerting rules for grab-mini, in the plain Prometheus rules format so
# `promtool check rules` and `promtool test rules` (alerts.test.yaml) run on
# them. deploy/k8s/generate.py wraps this file into a PrometheusRule resource.
#
# severity "page" wakes someone: it means riders are affected or data is at
# risk now. "ticket" is for working hours. Every alert links to its section of
# docs/runbook.md, which says what to check and what to do.
groups:
  - name: grab-mini.kafka
    rules:
      - alert: KafkaConsumerLagGrowing
        # Retry-tier groups (".retry.N") hold messages on purpose until they are
        # due, so their lag is normal. The location topic is high-volume, so it
        # has its own higher threshold below.
        expr: |
          sum by (consumergroup, topic) (kafka_consumergroup_lag{consumergroup!~".*\\.retry\\.[0-9]+", topic!="driver.location.updated"}) > 1000
          and
          deriv(sum by (consumergroup, topic) (kafka_consumergroup_lag{consumergroup!~".*\\.retry\\.[0-9]+", topic!="driver.location.updated"})[5m:30s]) > 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} is falling behind on {{ $labels.topic }}"
          description: "Lag is above 1000 messages and still growing. Riders see late or missing updates."
          runbook: "docs/runbook.md#consumer-lag"

      - alert: KafkaLocationConsumerLagGrowing
        expr: |
          sum by (consumergroup) (kafka_consumergroup_lag{topic="driver.location.updated"}) > 50000
          and
          deriv(sum by (consumergroup) (kafka_consumergroup_lag{topic="driver.location.updated"})[5m:30s]) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.consumergroup }} is behind on driver locations"
          description: "More than 50000 location updates are waiting and the backlog is growing; positions on the map are stale."
          runbook: "docs/runbook.md#consumer-lag"

      - alert: KafkaMessagesDeadLettered
        # Any message at all: a dead letter in the transactional flow is an event
        # that was not processed (an order not matched, a rating not counted).
        # Payment Service has its own, more specific alert (PaymentDeadLettered).
        expr: sum by (group, topic) (increase(kafka_consumer_messages_total{result="dead_lettered", topic!="driver.location.updated", group!="payment-service-group"}[5m])) > 0
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.group }} dead-lettered messages from {{ $labels.topic }}"
          description: "At least one message could not be processed after its retries. Fix the cause, then redrive with dlq-redrive."
          runbook: "docs/runbook.md#dead-letters"

      - alert: KafkaConsumerFailureRatioHigh
        expr: |
          sum by (group) (rate(kafka_consumer_messages_total{result=~"retried|dead_lettered"}[10m]))
          /
          sum by (group) (rate(kafka_consumer_messages_total[10m])) > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "More than 5% of {{ $labels.group }}'s messages are failing"
          description: "A dependency is probably unhealthy; messages are going through the retry topics."
          runbook: "docs/runbook.md#dead-letters"

      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_topic_partition_under_replicated_partition) > 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $value }} Kafka partition(s) are under-replicated"
          description: "A broker is down or lagging. With min.insync.replicas=2, losing one more replica stops producers."
          runbook: "docs/runbook.md#kafka-broker-down"

      - alert: KafkaBrokersMissing
        expr: kafka_brokers < 3
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Only {{ $value }} of 3 Kafka brokers are in the cluster"
          runbook: "docs/runbook.md#kafka-broker-down"

      - alert: KafkaPublishErrors
        expr: sum by (topic) (rate(kafka_publish_errors_total[5m])) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Publishing to {{ $labels.topic }} is failing"
          description: "Services could not publish. Outbox-backed topics retry on their own; Matching and the Location Gateway do not."
          runbook: "docs/runbook.md#kafka-broker-down"

      - alert: KafkaPublishSlow
        expr: histogram_quantile(0.99, sum by (le, topic) (rate(kafka_publish_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "p99 publish latency to {{ $labels.topic }} is above 1s"
          runbook: "docs/runbook.md#kafka-broker-down"

  - name: grab-mini.outbox
    rules:
      - alert: OutboxBacklog
        # The relay publishes within a second normally. 30s means it is stuck or Kafka is unreachable.
        expr: max by (source) (outbox_oldest_pending_age_seconds) > 30
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.source }} has events waiting {{ $value | humanizeDuration }} to be published"
          description: "State changes are committed but not announced: riders and other services are not being told."
          runbook: "docs/runbook.md#outbox-backlog"

      - alert: OutboxEventQuarantined
        # An event Kafka will never accept was moved to outbox_dead so it wouldn't
        # block the others. It will not be delivered unless a person decides what to do.
        expr: sum by (source, topic) (increase(outbox_quarantined_total[10m])) > 0
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.source }} quarantined an event for {{ $labels.topic }}"
          description: "Kafka rejected an event for good (too large, say). The state change is saved but nobody was told. See outbox_dead."
          runbook: "docs/runbook.md#outbox-backlog"

  - name: grab-mini.business
    rules:
      - alert: MatchLatencySLOBreach
        # SLO: 95% of orders get a driver within 3 seconds.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(matching_latency_seconds_bucket[10m]))) > 3
          and
          sum(rate(matching_latency_seconds_count[10m])) > 0.01
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "p95 time to match an order is {{ $value | humanizeDuration }} (SLO: 3s)"
          runbook: "docs/runbook.md#slow-matching"

      - alert: NoDriverRatioHigh
        expr: |
          sum(rate(matching_orders_total{result="no_driver"}[15m])) / sum(rate(matching_orders_total[15m])) > 0.3
          and
          sum(rate(matching_orders_total[15m])) > 0.05
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "More than 30% of orders find no driver"
          description: "Either supply is short, or driver locations/status are wrong (stale Redis, a stuck lease)."
          runbook: "docs/runbook.md#slow-matching"

      - alert: SurgePricingFailOpen
        # Pricing never blocks a booking: when Redis can't be read the price falls
        # back to 1.0. That is safe for riders, but it means surge is off.
        expr: sum(rate(orders_surge_fail_open_total[5m])) + sum(rate(pricing_fail_open_total[5m])) > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Surge multipliers can't be read: prices fall back to 1.0"
          runbook: "docs/runbook.md#surge-pricing"

      - alert: SurgeSamplerStalled
        # Pricing Service samples supply every few seconds. If it stopped while
        # orders keep coming, multipliers expire after 30s and surge silently turns off.
        expr: sum(rate(pricing_ticks_total[5m])) < 0.05 and on() sum(rate(orders_created_total[10m])) > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Pricing Service is not sampling supply: surge is off"
          runbook: "docs/runbook.md#surge-pricing"

      - alert: OrderCreationErrorBudgetBurn
        # SLO 99.9% of POST /orders succeed. Page when the budget burns 14.4x too
        # fast (2% of a 30-day budget in an hour) over both the last 5m and 1h,
        # so a brief blip doesn't page and an ongoing problem does.
        expr: |
          (
            sum(rate(http_requests_total{route="POST /orders", code=~"5.."}[5m])) / sum(rate(http_requests_total{route="POST /orders"}[5m])) > (14.4 * 0.001)
          )
          and
          (
            sum(rate(http_requests_total{route="POST /orders", code=~"5.."}[1h])) / sum(rate(http_requests_total{route="POST /orders"}[1h])) > (14.4 * 0.001)
          )
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Booking is failing: the error budget is burning 14x too fast"
          runbook: "docs/runbook.md#booking-errors"

      - alert: HTTPServerErrorsHigh
        expr: |
          sum by (route) (rate(http_requests_total{code=~"5.."}[5m])) / sum by (route) (rate(http_requests_total[5m])) > 0.05
          and
          sum by (route) (rate(http_requests_total[5m])) > 0.1
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "More than 5% of {{ $labels.route }} requests fail"
          runbook: "docs/runbook.md#booking-errors"

  - name: grab-mini.payments
    rules:
      - alert: PaymentConsumerLagHigh
        # Much lower than the generic 1000: a few hundred trips waiting means a few hundred
        # riders not yet charged and drivers not yet credited. It does not need to be growing.
        expr: sum by (consumergroup) (kafka_consumergroup_lag{consumergroup="payment-service-group"}) > 100
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "payment-service-group is {{ $value }} messages behind"
          description: "Completed trips are not being settled promptly: fares, tips and driver earnings are late."
          runbook: "docs/runbook.md#payments"

      - alert: PaymentDeadLettered
        # A dead letter here is a ride that was not charged (or a tip not paid out).
        expr: sum by (topic) (increase(kafka_consumer_messages_total{group="payment-service-group", result="dead_lettered"}[5m])) > 0
        labels: {severity: page}
        annotations:
          summary: "payment-service dead-lettered a message from {{ $labels.topic }}"
          description: "A trip event could not be settled after its retries, so that ride has no payment. Fix the cause, then redrive with dlq-redrive."
          runbook: "docs/runbook.md#payments"

      - alert: LedgerUnbalancedTransactionRejected
        # Unbalanced ledger transactions are refused before any write, so no money is wrong,
        # but the code that built one is: the event is dead-lettered and that trip is unpaid.
        expr: sum(increase(ledger_unbalanced_rejected_total[10m])) > 0
        labels: {severity: page}
        annotations:
          summary: "Payment Service built a ledger transaction that does not sum to zero"
          description: "The transaction was refused (nothing was written), which means a bug in how charges are split. The affected events are dead-lettered."
          runbook: "docs/runbook.md#payments"

  - name: grab-mini.workloads
    rules:
      - alert: DeploymentReplicasUnavailable
        expr: kube_deployment_status_replicas_unavailable{namespace="grab-mini"} > 0
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.deployment }} has {{ $value }} replica(s) not ready"
          description: "Check /readyz: a dependency (Postgres, Redis, Kafka) is probably down."
          runbook: "docs/runbook.md#pods-not-ready"

  # Redis (deploy/k8s/base/redis, scraped through the redis_exporter sidecar) and the data-ops CronJobs.
  - name: grab-mini.dataops
    rules:
      - alert: RedisNotExactlyOneMaster
        # Zero for a minute: a failover is not finishing. Two: a split brain, writes diverge.
        expr: (sum(redis_instance_info{namespace="grab-mini", role="master"}) or vector(0)) != 1
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Redis has {{ $value }} masters instead of 1"
          runbook: "docs/runbook.md#redis-failover"

      - alert: RedisMemoryNearLimit
        # maxmemory-policy is noeviction: at 100% writes fail, they are not evicted.
        expr: max(redis_memory_used_bytes{namespace="grab-mini"} / redis_memory_max_bytes{namespace="grab-mini"}) > 0.85
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "Redis memory is at {{ $value | humanizePercentage }} of maxmemory"
          runbook: "docs/runbook.md#redis-failover"

      - alert: PostgresBackupStale
        expr: time() - kube_cronjob_status_last_successful_time{namespace="grab-mini", cronjob=~"backup-.*"} > 86400
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "No successful {{ $labels.cronjob }} for more than 24 hours (it runs every 6)"
          description: "The backup RPO is being exceeded."
          runbook: "docs/runbook.md#backup-and-restore"

      - alert: DataOpsJobFailed
        expr: kube_job_status_failed{namespace="grab-mini", job_name=~"(backup|retention)-.*"} > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Job {{ $labels.job_name }} failed"
          runbook: "docs/runbook.md#backup-and-restore"
