<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">grab-mini architecture</title>
  <desc id="d">Rider and driver apps call REST services and a location gateway. Services publish Avro events to Kafka through a transactional outbox. Matching, pricing, driver location, rating and notification services consume them. ksqlDB reads the same topics for the ops dashboard. Notification pushes to the apps over WebSocket.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475467"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b8a4f"/></marker>
  </defs>
  <rect width="1000" height="600" rx="14" fill="#ffffff" stroke="#e4e7ec"/>

  <!-- clients -->
  <rect x="14" y="50" width="150" height="270" rx="12" fill="#f9fafb" stroke="#98a2b3" stroke-dasharray="5 4"/>
  <text x="89" y="70" text-anchor="middle" font-size="11" fill="#667085">CLIENTS (browsers)</text>
  <rect x="24" y="84" width="130" height="58" rx="10" fill="#e8f2fe" stroke="#2e90fa"/>
  <text x="89" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Rider App</text>
  <text x="89" y="126" text-anchor="middle" font-size="11" fill="#475467">React · Leaflet</text>
  <rect x="24" y="240" width="130" height="58" rx="10" fill="#e8f2fe" stroke="#2e90fa"/>
  <text x="89" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Driver App</text>
  <text x="89" y="282" text-anchor="middle" font-size="11" fill="#475467">React · Leaflet</text>

  <!-- edge services -->
  <rect x="215" y="44" width="170" height="70" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="300" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Order Service</text>
  <text x="300" y="89" text-anchor="middle" font-size="11" fill="#475467">REST · Postgres · outbox</text>
  <rect x="215" y="150" width="170" height="70" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="300" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Trip Service</text>
  <text x="300" y="195" text-anchor="middle" font-size="11" fill="#475467">REST · Postgres · outbox</text>
  <rect x="215" y="262" width="170" height="70" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="300" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Location Gateway</text>
  <text x="300" y="307" text-anchor="middle" font-size="11" fill="#475467">rate limit · batching</text>

  <!-- kafka -->
  <rect x="430" y="44" width="170" height="402" rx="12" fill="#fff7e6" stroke="#f79009" stroke-width="1.5"/>
  <text x="515" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#101828">Apache Kafka</text>
  <g font-size="11" fill="#101828" text-anchor="middle">
    <rect x="442" y="80" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="96">order.created</text>
    <rect x="442" y="112" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="128">order.matched</text>
    <rect x="442" y="144" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="160">order.no_driver_found</text>
    <rect x="442" y="176" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="192">order.cancelled</text>
    <rect x="442" y="208" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="224">trip.status.changed</text>
    <rect x="442" y="240" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="256">trip.rated</text>
    <rect x="442" y="272" width="146" height="24" rx="6" fill="#ffffff" stroke="#fdb022"/><text x="515" y="288">driver.location.updated</text>
  </g>
  <text x="515" y="322" text-anchor="middle" font-size="11" fill="#475467">each topic keyed by orderId,</text>
  <text x="515" y="338" text-anchor="middle" font-size="11" fill="#475467">tripId or driverId (ordering)</text>
  <text x="515" y="366" text-anchor="middle" font-size="11" fill="#475467">+ retry tiers and DLQ per topic</text>
  <rect x="446" y="386" width="138" height="42" rx="8" fill="#ffffff" stroke="#98a2b3"/>
  <text x="515" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#101828">Schema Registry</text>
  <text x="515" y="419" text-anchor="middle" font-size="11" fill="#475467">Avro · BACKWARD</text>

  <!-- consumers -->
  <rect x="640" y="44" width="190" height="70" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="735" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Matching Service</text>
  <text x="735" y="89" text-anchor="middle" font-size="11" fill="#475467">Redis GEO · atomic claim + lease</text>
  <rect x="640" y="128" width="190" height="58" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="735" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Pricing Service</text>
  <text x="735" y="170" text-anchor="middle" font-size="11" fill="#475467">surge · signed quotes</text>
  <rect x="640" y="200" width="190" height="58" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="735" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Driver Location Service</text>
  <text x="735" y="242" text-anchor="middle" font-size="11" fill="#475467">Redis GEO · drops stale updates</text>
  <rect x="640" y="272" width="190" height="58" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="735" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Rating Service</text>
  <text x="735" y="314" text-anchor="middle" font-size="11" fill="#475467">Postgres · deduped by eventId</text>
  <rect x="640" y="344" width="190" height="84" rx="10" fill="#e8f8ef" stroke="#12b76a"/>
  <text x="735" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Notification Service</text>
  <text x="735" y="391" text-anchor="middle" font-size="11" fill="#475467">WebSocket · Redis pub/sub</text>
  <text x="735" y="407" text-anchor="middle" font-size="11" fill="#475467">(scales out)</text>

  <!-- analytics -->
  <rect x="870" y="44" width="116" height="70" rx="10" fill="#f4ebff" stroke="#9e77ed"/>
  <text x="928" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">ksqlDB</text>
  <text x="928" y="89" text-anchor="middle" font-size="11" fill="#475467">windows · join</text>
  <rect x="870" y="160" width="116" height="58" rx="10" fill="#f4ebff" stroke="#9e77ed"/>
  <text x="928" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#101828">Ops dashboard</text>
  <text x="928" y="202" text-anchor="middle" font-size="11" fill="#475467">pull queries</text>

  <!-- request arrows -->
  <g stroke="#475467" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M154 104 L215 78"/>
    <path d="M154 126 L215 172"/>
    <path d="M154 258 L215 208"/>
    <path d="M154 280 L215 292"/>
    <!-- producers into kafka -->
    <path d="M385 80 L430 80"/>
    <path d="M385 185 L430 185"/>
    <path d="M385 297 L430 297"/>
    <!-- kafka to consumers -->
    <path d="M600 157 L640 157"/>
    <path d="M600 229 L640 229"/>
    <path d="M600 301 L640 301"/>
    <path d="M600 386 L640 386"/>
    <!-- analytics -->
    <path d="M928 114 L928 160"/>
    <path d="M600 52 L612 52 L612 22 L928 22 L928 44"/>
  </g>
  <path d="M600 80 L640 80" stroke="#475467" stroke-width="1.5" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- websocket push -->
  <path d="M735 428 L735 500 L89 500 L89 320" stroke="#0b8a4f" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#w)"/>
  <text x="412" y="492" text-anchor="middle" font-size="12" font-weight="600" fill="#0b8a4f">WebSocket push to rider and driver (best-effort; apps recover over REST)</text>

  <!-- legend -->
  <text x="24" y="540" font-size="12" fill="#475467">Solid arrows: HTTP requests and Kafka events. Producers write state and event in one Postgres transaction (outbox); consumers are idempotent (at-least-once).</text>
  <text x="24" y="560" font-size="12" fill="#475467">Every API and WebSocket carries a JWT (Auth Service, dev only). Drivers' phones never talk to Kafka directly: they report through the Location Gateway.</text>
  <text x="24" y="580" font-size="12" fill="#475467">Data stores: Postgres (orders, trips, ratings, outbox), Redis (driver status and GEO, routing, pub/sub). Retry tiers and a DLQ exist for every consumed topic.</text>
</svg>
