name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROMETHEUS_VERSION: "3.5.0"

jobs:
  # Derive the module list from go.work so new modules are picked up automatically.
  go-modules:
    name: go modules list
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      kafka_modules: ${{ steps.list.outputs.kafka_modules }}
      secure_kafka_modules: ${{ steps.list.outputs.secure_kafka_modules }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -euo pipefail
          modules=$(sed -n 's#^[[:space:]]*\(\./[^[:space:]]*\)[[:space:]]*$#\1#p' go.work \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"
          echo "${modules}"
          # Modules whose tests need a real broker also run in go-kafka (plain), and those that
          # need the TLS/SASL/ACL broker in go-kafka-secure.
          modules_with() {
            grep -rl --include='*_test.go' "$1" . | MODULES="${modules}" python3 -c '
          import json, os, sys
          mods = json.loads(os.environ["MODULES"])
          found = set()
          for line in sys.stdin:
              path = line.strip()
              best = max((m for m in mods if path.startswith(m + "/")), key=len, default=None)
              if best:
                  found.add(best)
          print(json.dumps(sorted(found)))'
          }
          kafka_modules=$(modules_with 'TEST_KAFKA_BROKERS')
          secure_kafka_modules=$(modules_with 'TEST_SECURE_KAFKA_BROKER')
          echo "kafka_modules=${kafka_modules}" >> "$GITHUB_OUTPUT"
          echo "secure_kafka_modules=${secure_kafka_modules}" >> "$GITHUB_OUTPUT"
          echo "kafka modules: ${kafka_modules}"
          echo "secure kafka modules: ${secure_kafka_modules}"

  go:
    name: go (${{ matrix.module }})
    needs: go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.go-modules.outputs.modules) }}
    # Versions match docker-compose.yml. Tests skip themselves when these env vars are
    # unset; Kafka-gated tests (TEST_KAFKA_BROKERS etc.) are not run in CI and skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grabmini
          POSTGRES_PASSWORD: grabmini
          POSTGRES_DB: grabmini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grabmini -d grabmini"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://grabmini:grabmini@localhost:5432/grabmini?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: gofmt
        run: |
          set -euo pipefail
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          set -euo pipefail
          go test -v ./... 2>&1 | tee "${RUNNER_TEMP}/go-test.log"
      # Tests that need a service the job lacks (Kafka, ...) skip themselves, so a green run
      # can hide them. Count what actually ran so the numbers are visible per module.
      - name: test summary
        if: always()
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/go-test.log"
          [ -f "$log" ] || exit 0
          pass=$(grep -c -E '^[[:space:]]*--- PASS' "$log" || true)
          skip=$(grep -c -E '^[[:space:]]*--- SKIP' "$log" || true)
          fail=$(grep -c -E '^[[:space:]]*--- FAIL' "$log" || true)
          line="${{ matrix.module }}: pass=${pass} skip=${skip} fail=${fail}"
          echo "$line"
          echo "- ${line}" >> "$GITHUB_STEP_SUMMARY"

  # Same checks as `go`, but with a real Kafka broker, for the modules whose tests need one
  # (they skip themselves in the plain `go` job).
  go-kafka:
    name: go + kafka (${{ matrix.module }})
    needs: go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.go-modules.outputs.kafka_modules) }}
    services:
      # Single-node KRaft broker, same image and default settings as docker-compose.yml
      # (including Kafka's 3s wait before a new consumer group's first rebalance).
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:19093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          CLUSTER_ID: grabminikafkacluster01
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grabmini
          POSTGRES_PASSWORD: grabmini
          POSTGRES_DB: grabmini
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grabmini -d grabmini"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_KAFKA_BROKERS: localhost:9092
      TEST_DATABASE_URL: postgres://grabmini:grabmini@localhost:5432/grabmini?sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: test
        run: |
          set -euo pipefail
          go test -v ./... 2>&1 | tee "${RUNNER_TEMP}/go-test.log"
      - name: test summary
        if: always()
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/go-test.log"
          [ -f "$log" ] || exit 0
          pass=$(grep -c -E '^[[:space:]]*--- PASS' "$log" || true)
          skip=$(grep -c -E '^[[:space:]]*--- SKIP' "$log" || true)
          fail=$(grep -c -E '^[[:space:]]*--- FAIL' "$log" || true)
          line="kafka ${{ matrix.module }}: pass=${pass} skip=${skip} fail=${fail}"
          echo "$line"
          echo "- ${line}" >> "$GITHUB_STEP_SUMMARY"

  # Kafka with TLS, SASL/SCRAM and ACLs, set up by the repo's own deploy/kafka-secure/start-local.sh
  # (which runs scripts/kafka-acls.sh), for the tests that check least privilege.
  go-kafka-secure:
    name: go + secure kafka (${{ matrix.module }})
    needs: go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.go-modules.outputs.secure_kafka_modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Start Kafka with TLS, SASL and ACLs
        run: |
          set -euo pipefail
          # The Kafka distribution comes from the same pinned image the plain job uses.
          docker create --name kafka-dist apache/kafka:3.8.0 >/dev/null
          docker cp kafka-dist:/opt/kafka "${RUNNER_TEMP}/kafka"
          docker rm kafka-dist >/dev/null
          export KAFKA_HOME="${RUNNER_TEMP}/kafka" DIR="${RUNNER_TEMP}/kafka-secure"
          deploy/kafka-secure/start-local.sh
          {
            echo "TEST_SECURE_KAFKA_BROKER=localhost:9094"
            echo "TEST_SECURE_KAFKA_CA=${DIR}/ca.pem"
            echo "TEST_SECURE_KAFKA_SECRETS=${DIR}/secrets"
            echo "TEST_SECURE_KAFKA_ADMIN=$(cat "${DIR}/admin.password")"
            echo "KAFKA_SECURE_DIR=${DIR}"
          } >> "$GITHUB_ENV"
      - name: test
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          # Only the tests in the files that use the secure broker; the plain ones run in go-kafka.
          files=$(grep -l 'TEST_SECURE_KAFKA_BROKER' ./*_test.go)
          names=$(grep -h -o '^func Test[A-Za-z0-9_]*' $files | sed 's/^func //' | paste -sd'|' -)
          go test -v -run "^(${names})\$" ./... 2>&1 | tee "${RUNNER_TEMP}/go-test.log"
      - name: test summary
        if: always()
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/go-test.log"
          [ -f "$log" ] || exit 0
          pass=$(grep -c -E '^[[:space:]]*--- PASS' "$log" || true)
          skip=$(grep -c -E '^[[:space:]]*--- SKIP' "$log" || true)
          fail=$(grep -c -E '^[[:space:]]*--- FAIL' "$log" || true)
          line="secure kafka ${{ matrix.module }}: pass=${pass} skip=${skip} fail=${fail}"
          echo "$line"
          echo "- ${line}" >> "$GITHUB_STEP_SUMMARY"
      - name: broker log
        if: failure()
        run: tail -n 100 "${KAFKA_SECURE_DIR}/broker.log" || true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The test toolchain needs it: jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26, and
          # its undici needs zlib.createZstdDecompress, which Node 20 doesn't have (vitest
          # then fails to start its workers). Keep in step with "engines" in package.json.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @grab-mini/rider build
      - run: pnpm --filter @grab-mini/driver build
      - run: pnpm --filter @grab-mini/ops build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: pnpm test:e2e

  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          set -euo pipefail
          dir="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          curl -fsSL -o "${RUNNER_TEMP}/prom.tgz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${dir}.tar.gz"
          tar -xzf "${RUNNER_TEMP}/prom.tgz" -C "${RUNNER_TEMP}" "${dir}/promtool"
          echo "${RUNNER_TEMP}/${dir}" >> "$GITHUB_PATH"
      - run: promtool --version
      - run: promtool check rules deploy/monitoring/alerts.rules.yaml
      - run: promtool test rules deploy/monitoring/alerts.test.yaml

  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 deploy/k8s/generate.py --check
      - name: kustomize render + cross-checks
        run: |
          set -euo pipefail
          kubectl kustomize deploy/k8s/base | python3 deploy/k8s/check.py
